<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>BuschGirls Gallery</title>
  <link rel="stylesheet" href="/buschgirls-gallery/gallery.css">
</head>
<body>
  <header id="toolbar" class="toolbar">
    <div class="toolbar-brand">
      <button id="backBtn" class="toolbar-icon back-button" type="button" aria-label="Back to Admin">←</button>
      <h1>BuschGirls Gallery</h1>
      <button id="searchToggle" class="toolbar-icon mobile-action" type="button" aria-label="Search filenames" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.5 19-4.4-4.4a7.5 7.5 0 1 0-1.5 1.5l4.4 4.4 1.5-1.5ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg>
      </button>
      <button class="toolbar-icon filter-button mobile-action" type="button" aria-label="Open filters" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3V5Zm3 6h12v2H6v-2Zm4 6h4v2h-4v-2Z"/></svg><span class="filter-badge" hidden></span>
      </button>
    </div>
    <div class="toolbar-controls">
      <div class="search-control">
        <label class="visually-hidden" for="filenameSearch">Search filenames</label>
        <input id="filenameSearch" type="search" maxlength="100" placeholder="Filename" autocomplete="off">
        <button id="clearSearch" type="button" aria-label="Clear filename search" hidden>×</button>
      </div>
      <label class="folder-control"><span>Folder</span><select id="folderFilter" aria-label="Folder"><option value="all">All</option><option>soft</option><option>spicy</option><option>spicier</option></select></label>
      <label class="sort-control"><span>Sort</span><select id="sortSelect" aria-label="Sort photos"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="filename_asc">Filename A–Z</option><option value="filename_desc">Filename Z–A</option></select></label>
      <button class="toolbar-icon filter-button desktop-filter" type="button" aria-label="Open filters" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3V5Zm3 6h12v2H6v-2Zm4 6h4v2h-4v-2Z"/></svg><span class="filter-badge" hidden></span>
      </button>
      <span id="itemCount" class="item-count" aria-live="polite">—</span>
      <div class="pagination" aria-label="Gallery pagination">
        <button id="previousPage" type="button" aria-label="Previous page">‹</button>
        <label class="visually-hidden" for="pageInput">Page number</label>
        <input id="pageInput" type="number" min="1" max="1" inputmode="numeric" aria-label="Page number">
        <span aria-hidden="true">/</span>
        <span id="totalPages">—</span>
        <button id="nextPage" type="button" aria-label="Next page">›</button>
      </div>
    </div>
    <button id="selectBtn" class="toolbar-icon select-button" type="button" aria-pressed="false" aria-label="Select photos" title="Select photos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm-1.5-4.6-3.2-3.2 1.4-1.4 1.8 1.8 4.6-4.6 1.4 1.4-6 6Z"/></svg><span class="select-label">Select</span>
    </button>
  </header>
  <div id="filterPanel" class="filter-panel" role="dialog" aria-label="Gallery filters" hidden>
    <label>Rotation<select id="activeState"><option value="all">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
    <label>Exact hash<select id="duplicateState"><option value="all">All</option><option id="exactDuplicatesOption" value="exact">Exact duplicates only</option></select></label>
    <p id="duplicateHint" class="filter-hint" hidden>No hashes are available yet.</p>
    <div class="filter-actions"><button id="clearFilters" class="button-quiet" type="button">Clear Filters</button><button id="closeFilters" class="button-primary" type="button">Done</button></div>
  </div>
  <main>
    <div id="status" class="status" role="status"></div>
    <section id="expired" class="expired" hidden>
      <h2>Admin session expired</h2>
      <p>Return to the NASCAR app and unlock admin again.</p>
      <button class="returnBtn" type="button">Back to main application</button>
    </section>
    <section id="galleryGrid" class="gallery-grid" aria-label="Photo gallery"></section>
  </main>

  <div id="contextMenu" class="context-menu" role="menu" hidden>
    <div class="context-head"><div id="contextPath" class="context-path"></div><div id="contextDate" class="context-date"></div></div>
    <button type="button" class="context-item" data-action="view" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4V4Zm10 0h6v6h-2V6h-4V4ZM4 14h2v4h4v2H4v-6Zm14 4v-4h2v6h-6v-2h4Z"/></svg>View Full Size</button>
    <button type="button" class="context-item" data-action="select" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm-1.5-4.6-3.2-3.2 1.4-1.4 1.8 1.8 4.6-4.6 1.4 1.4-6 6Z"/></svg>Select Multiple</button>
    <div class="context-section">
      <div class="context-move-label">Move to</div>
      <div id="contextMove" class="folder-move"><button type="button" class="folder-chip" data-move="soft" role="menuitem">soft</button><button type="button" class="folder-chip" data-move="spicy" role="menuitem">spicy</button><button type="button" class="folder-chip" data-move="spicier" role="menuitem">spicier</button></div>
    </div>
    <button type="button" class="context-item danger" data-action="delete" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2ZM6 9h12l-.9 11.1A2 2 0 0 1 15.1 22H8.9a2 2 0 0 1-2-1.9L6 9Zm4 3v7h1.5v-7H10Zm2.5 0v7H14v-7h-1.5Z"/></svg>Permanently Delete</button>
  </div>

  <div id="selectionBar" class="selection-bar" role="toolbar" aria-label="Selected photos" hidden>
    <span id="selectionCount" class="selection-count" aria-live="polite">0 selected</span>
    <button id="selectPage" type="button">Select page</button>
    <button id="deleteSelected" class="danger" type="button" disabled>Delete</button>
    <button id="exitSelect" type="button">Done</button>
  </div>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
    <button id="viewerClose" class="viewer-round viewer-close" type="button" aria-label="Close full-size viewer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg></button>
    <button id="viewerPrevious" class="viewer-round viewer-nav previous" type="button" aria-label="Previous image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5 8.4 12l7 7-1.4 1.4L5.6 12 14 3.6 15.4 5Z"/></svg></button>
    <figure>
      <img id="viewerImage" alt="">
      <figcaption class="viewer-dock">
        <div class="viewer-info"><strong id="viewerTitle"></strong><span id="viewerMeta"></span></div>
        <div class="viewer-actions">
          <div id="viewerMove" class="folder-move" role="group" aria-label="Move to folder"><button type="button" class="folder-chip" data-move="soft">soft</button><button type="button" class="folder-chip" data-move="spicy">spicy</button><button type="button" class="folder-chip" data-move="spicier">spicier</button></div>
          <button id="viewerDelete" class="viewer-delete" type="button" title="Permanently delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2ZM6 9h12l-.9 11.1A2 2 0 0 1 15.1 22H8.9a2 2 0 0 1-2-1.9L6 9Zm4 3v7h1.5v-7H10Zm2.5 0v7H14v-7h-1.5Z"/></svg>Delete</button>
        </div>
      </figcaption>
    </figure>
    <button id="viewerNext" class="viewer-round viewer-nav next" type="button" aria-label="Next image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.6 19 7-7-7-7L10 3.6l8.4 8.4-8.4 8.4L8.6 19Z"/></svg></button>
  </div>

  <script src="/buschgirls-gallery/gallery.js" defer></script>
</body>
</html>
